# Dependabot configuration — TEMPLATE.
#
# Copied into every service by ONBOARDING.md §1.4 (`cp -r templates/.github .github`).
# Review the marked sections for your service before the first push.
#
# ─────────────────────────────────────────────────────────────────────────
# WHY THIS FILE EXISTS AT ALL
#   Without it a repo gets zero version-update PRs — but "Dependabot security
#   updates" is enabled org-wide, and those PRs open regardless. This file is
#   what bounds and groups them. Deleting it does not turn Dependabot off; it
#   only gives up control over what it does.
#
# THE HOUSE POSTURE
#   1. Prefer ranges in requirements.txt over exact pins, and do not commit a
#      lockfile unless you need one. An unresolved range gives GitHub nothing
#      to match against an advisory, so alert volume stays near zero.
#   2. Security-only PRs (`open-pull-requests-limit: 0`), grouped into one PR.
#      Setting `open-pull-requests-limit: 0` disables routine version-update
#      churn while keeping `groups` and `ignore` rules active on security
#      updates. Every Dependabot PR burns a `{service}-pr` Cloud Build run and
#      needs a CODEOWNERS approval, so security updates are grouped into a
#      single PR per directory.
#   3. Restate every deliberate version cap as an `ignore` rule — see below.
#   4. List EVERY directory in the repo that holds a manifest (`requirements.txt`,
#      `pyproject.toml`, `package.json`). Omitting a directory from this file
#      only turns off *version* updates for it — repo-wide *security* updates
#      still scan it and will open ungrouped PRs if it is not listed here.
#      If `archive/` holds an old `requirements.txt`, use the `/archive` block
#      below with `ignore: [{ dependency-name: "*" }]` to block all PRs from it.
#
# THE IGNORE RULES  ← REVIEW THIS PER SERVICE
#   If requirements.txt caps a major ("pandas>=2.2.0,<3.0"), that cap is load
#   bearing and Dependabot cannot read the comment explaining why. Restate it
#   here, scoped to semver-major ONLY so real security patches inside the
#   allowed range still raise a PR.
#
#   When you intentionally lift a cap in requirements.txt, delete the matching
#   ignore rule in the SAME commit, or the bump is silently skipped.
# ─────────────────────────────────────────────────────────────────────────

version: 2

updates:
  # ── The service itself ────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # 0 disables routine version-update PRs; security updates still open and
    # obey `groups` and `ignore` below.
    open-pull-requests-limit: 0
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
    groups:
      python-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # REVIEW: one entry per major capped in your requirements.txt.
      # Delete this block entirely if your service caps nothing.
      # - dependency-name: "pandas"
      #   update-types: ["version-update:semver-major"]

  # ── Dockerfile base image ─────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    labels: ["dependencies"]
    commit-message:
      prefix: "deps(docker)"
    ignore:
      # REVIEW: base-image major/minor moves are a deliberate, tested change
      # (the CI test step runs on python:3.11). Patch updates still come
      # through. Change `python` to whatever your FROM line uses.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # ── OPTIONAL: extra manifests (Cloud Functions, sidecars, …) ──────────
  # Add one block per subdirectory that has its own requirements.txt, or
  # security updates in that directory will open ungrouped PRs.
  # - package-ecosystem: "pip"
  #   directory: "/functions/my_function"
  #   schedule:
  #     interval: "monthly"
  #   open-pull-requests-limit: 0
  #   groups:
  #     my-function-security:
  #       applies-to: security-updates
  #       patterns: ["*"]

  # ── OPTIONAL: archived manifests (/archive) ───────────────────────────
  # Uncomment if `archive/` contains a `requirements.txt` so Dependabot blocks
  # all PRs (both security and version updates) for archived code.
  # - package-ecosystem: "pip"
  #   directory: "/archive"
  #   schedule:
  #     interval: "monthly"
  #   open-pull-requests-limit: 0
  #   ignore:
  #     - dependency-name: "*"
